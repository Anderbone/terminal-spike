[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compose-bom = "2026.04.01"
activity-compose = "1.12.4"
core-ktx = "1.17.0"
lifecycle = "2.10.0"
junit4 = "4.13.2"
androidx-test-ext = "1.3.0"
espresso = "3.7.0"
